<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SR Request Closed Notification</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .btn-custom {
            margin-right: 10px;
        }
        .btn-container {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
        }
        .button-group {
            display: flex;
            justify-content: flex-start;
            gap: 20px;
            margin-top: 20px;
            margin-left: auto;
            margin-right: auto;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2>SR Request Closed - Request No: {{ sr_request.psn }}</h2>
        <p>The SR request has been marked as <strong>Closed</strong>. Below are the details:</p>
 

        <p>You can view the full details of the request by clicking the link below:</p>
        <p><a href="{{ details_url }}" class="btn btn-primary" style="text-decoration: none;">View Request Details</a></p>
        <p>Thank you.</p>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
