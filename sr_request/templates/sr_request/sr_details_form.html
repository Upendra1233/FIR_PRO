<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Approval Request Form (SARF)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-container {
            background-color: #f8f9fa;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .form-header {
            background-color: #007bff;
            color: white;
            padding: 10px;
            border-radius: 8px 8px 0 0;
            text-align: center;
            font-size: 1.5rem;
        }
        .form-footer {
            text-align: center;
            margin-top: 20px;
        }
        .btn-submit {
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            font-size: 1rem;
        }
        .btn-submit:hover {
            background-color: #218838;
        }
        .popup-message {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #dc3545; /* Red background for error */
            color: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: none;
            z-index: 1000;
        }
        .read-only-message {
            margin-bottom: 20px;
            padding: 10px;
            background-color: #ffc107;
            color: #856404;
            border: 1px solid #ffeeba;
            border-radius: 5px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="form-container">
            <div class="form-header">
                Subscription Approval Request Form (SARF)
            </div>
            {% if read_only %}
                <div class="read-only-message">
                    This form is read-only because the request has been approved.
                </div>
            {% endif %}
            <form id="sr-details-form" method="post">
                {% csrf_token %}
                <div class="row">
                    <!-- Engineer -->
                    <div class="col-md-4 mb-3">
                        <label for="id_engineer" class="form-label">Engineer</label>
                        <select name="engineer" id="id_engineer" class="form-control" {% if read_only %}disabled{% endif %}>
                            <option value="">-- Select Engineer --</option>
                            <option value="Dilip" {% if sr_request.engineer == "Dilip" %}selected{% endif %}>Dilip</option>
                            <option value="Siva" {% if sr_request.engineer == "Siva" %}selected{% endif %}>Siva</option>
                            <option value="Kunal" {% if sr_request.engineer == "Kunal" %}selected{% endif %}>Kunal</option>
                            <option value="Narendra" {% if sr_request.engineer == "Narendra" %}selected{% endif %}>Narendra</option>
                            <option value="Arun" {% if sr_request.engineer == "Arun" %}selected{% endif %}>Arun</option>
                            <option value="Others" {% if sr_request.engineer == "Others" %}selected{% endif %}>Others</option>
                        </select>
                        <input type="text" id="id_engineer_other" name="engineer_other" class="form-control mt-2" style="display: none;" placeholder="Please specify..." {% if read_only %}readonly{% endif %}>
                    </div>

                    <!-- Request Date -->
                    <div class="col-md-4 mb-3">
                        <label for="id_date" class="form-label">Request Date</label>
                        <input type="datetime-local" name="date" id="id_date" class="form-control" value="{{ sr_request.date|date:'Y-m-d\TH:i' }}" {% if read_only %}readonly{% endif %}>
                    </div>

                    <!-- Category -->
                    <div class="col-md-4 mb-3">
                        <label for="id_category" class="form-label">Category</label>
                        <select name="category" id="id_category" class="form-control" {% if read_only %}disabled{% endif %}>
                            <option value="">-- Select Category --</option>
                            <option value="AIS 140" {% if sr_request.category == "AIS 140" %}selected{% endif %}>AIS 140</option>
                            <option value="BS Extension" {% if sr_request.category == "BS Extension" %}selected{% endif %}>BS Extension</option>
                            <option value="Commercial Activation" {% if sr_request.category == "Commercial Activation" %}selected{% endif %}>Commercial Activation</option>
                            <option value="Validity Transfer" {% if sr_request.category == "Validity Transfer" %}selected{% endif %}>Validity Transfer</option>
                            <option value="OTC RSU" {% if sr_request.category == "OTC RSU" %}selected{% endif %}>OTC RSU</option>
                            <option value="Resumption SR" {% if sr_request.category == "Resumption SR" %}selected{% endif %}>Resumption SR</option>
                            <option value="Others" {% if sr_request.category == "Others" %}selected{% endif %}>Others</option>
                        </select>
                    </div>
                </div>

                <div class="row">
                    <!-- Old PSN -->
                    <div class="col-md-4 mb-3">
                        <label for="id_old_psn" class="form-label">Old PSN</label>
                        <input type="text" name="old_psn" id="id_old_psn" class="form-control" maxlength="10" value="{{ sr_request.old_psn }}" placeholder="Enter Old PSN" {% if read_only %}readonly{% endif %}>
                    </div>

                    <!-- Old ICCID -->
                    <div class="col-md-4 mb-3">
                        <label for="id_old_iccid" class="form-label">Old ICCID</label>
                        <input type="text" name="old_iccid" id="id_old_iccid" class="form-control" maxlength="20" value="{{ sr_request.old_iccid }}" placeholder="Enter Old ICCID" {% if read_only %}readonly{% endif %}>
                    </div>

                    <!-- Old Sim Status -->
                    <div class="col-md-4 mb-3">
                        <label for="id_old_sim_status" class="form-label">Old Sim Status</label>
                        <textarea name="old_sim_status" id="id_old_sim_status" class="form-control" rows="1" placeholder="Enter Old Sim Status" {% if read_only %}readonly{% endif %}>{{ sr_request.old_sim_status }}</textarea>
                    </div>
                </div>

                <div class="row">
                    <!-- Old Validity -->
                    <div class="col-md-4 mb-3">
                        <label for="id_old_validity" class="form-label">Old Validity</label>
                        <input type="datetime-local" name="old_validity" id="id_old_validity" class="form-control" value="{{ sr_request.old_validity|date:'Y-m-d\TH:i' }}" {% if read_only %}readonly{% endif %}>
                    </div>

                    <!-- PSN -->
                    <div class="col-md-4 mb-3">
                        <label for="id_psn" class="form-label">PSN</label>
                        <input type="text" name="psn" id="id_psn" class="form-control" maxlength="10" value="{{ sr_request.psn }}" placeholder="Enter 10-digit PSN" {% if read_only %}readonly{% endif %}>
                    </div>

                    <!-- ICICID -->
                    <div class="col-md-4 mb-3">
                        <label for="id_icicid" class="form-label">ICICID</label>
                        <input type="text" name="icicid" id="id_icicid" class="form-control" maxlength="20" value="{{ sr_request.icicid }}" placeholder="Enter 20-digit ICICID" {% if read_only %}readonly{% endif %}>
                    </div>
                </div>

                <div class="row">
                    <!-- Plan -->
                    <div class="col-md-4 mb-3">
                        <label for="id_plan" class="form-label">Plan</label>
                        <select name="plan" id="id_plan" class="form-control" {% if read_only %}disabled{% endif %}>
                            <option value="">-- Select Plan --</option>
                            <option value="Top-Up" {% if sr_request.plan == "Top-Up" %}selected{% endif %}>Top-Up</option>
                            <option value="Single Airtel" {% if sr_request.plan == "Single Airtel" %}selected{% endif %}>Single Airtel</option>
                            <option value="Dual 12 Months" {% if sr_request.plan == "Dual 12 Months" %}selected{% endif %}>Dual 12 Months</option>
                            <option value="Dual AIS140" {% if sr_request.plan == "Dual AIS140" %}selected{% endif %}>Dual AIS140</option>
                            <option value="Single BSNL" {% if sr_request.plan == "Single BSNL" %}selected{% endif %}>Single BSNL</option>
                            <option value="Others" {% if sr_request.plan == "Others" %}selected{% endif %}>Others</option>
                        </select>
                    </div>

                    <!-- Billing To -->
                    <div class="col-md-4 mb-3">
                        <label for="id_billing_to" class="form-label">Billing To</label>
                        <select name="billing_to" id="id_billing_to" class="form-control" {% if read_only %}disabled{% endif %}>
                            <option value="">-- Select Billing To --</option>
                            <option value="Good well" {% if sr_request.billing_to == "Good well" %}selected{% endif %}>Good well</option>
                            <option value="Customer" {% if sr_request.billing_to == "Customer" %}selected{% endif %}>Customer</option>
                            <option value="Engineering" {% if sr_request.billing_to == "Engineering" %}selected{% endif %}>Engineering</option>
                            <option value="Service" {% if sr_request.billing_to == "Service" %}selected{% endif %}>Service</option>
                            <option value="Others" {% if sr_request.billing_to == "Others" %}selected{% endif %}>Others</option>
                        </select>
                    </div>

                    <!-- Remarks -->
                    <div class="col-md-4 mb-3">
                        <label for="id_remarks" class="form-label">Remarks</label>
                        <textarea name="remarks" id="id_remarks" class="form-control" rows="1" placeholder="Enter remarks" {% if read_only %}readonly{% endif %}>{{ sr_request.remarks }}</textarea>
                    </div>
                </div>

                <div class="row">
                    <!-- HOD Remarks -->
                    <div class="col-md-4 mb-3">
                        <label for="id_hod_remarks" class="form-label">HOD Remarks</label>
                        <textarea name="hod_remarks" id="id_hod_remarks" class="form-control" rows="1" placeholder="Enter HOD remarks" {% if read_only %}readonly{% endif %}>{{ sr_request.hod_remarks }}</textarea>
                    </div>

                    <!-- Engineer Email -->
                    <div class="col-md-4 mb-3">
                        <label for="id_engineer_email" class="form-label">Engineer Email</label>
                        <input type="email" name="engineer_email" id="id_engineer_email" class="form-control" value="{{ sr_request.engineer_email }}" placeholder="Enter Engineer Email" {% if read_only %}readonly{% endif %}>
                    </div>
                </div>

                <div class="form-footer">
                    {% if not read_only %}
                        <button type="submit" class="btn-submit">Submit</button>
                    {% endif %}
                </div>
            </form>
        </div>
    </div>

    <!-- Popup Message -->
    <div id="popup-message" class="popup-message"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('sr-details-form');
            const popup = document.getElementById('popup-message');

            form.addEventListener('submit', function (event) {
                event.preventDefault(); // Prevent default form submission

                const formData = new FormData(form);

                fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest',
                    },
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // Show success message
                        popup.textContent = data.message;
                        popup.style.backgroundColor = '#28a745'; // Green background for success
                        popup.style.display = 'block';

                        // Hide the popup after 3 seconds
                        setTimeout(() => {
                            popup.style.display = 'none';
                        }, 3000);
                    } else {
                        // Show error message
                        popup.textContent = data.message;
                        popup.style.backgroundColor = '#dc3545'; // Red background for error
                        popup.style.display = 'block';

                        // Hide the popup after 3 seconds
                        setTimeout(() => {
                            popup.style.display = 'none';
                        }, 3000);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    popup.textContent = 'An error occurred. Please try again.';
                    popup.style.backgroundColor = '#dc3545'; // Red background for error
                    popup.style.display = 'block';

                    // Hide the popup after 3 seconds
                    setTimeout(() => {
                        popup.style.display = 'none';
                    }, 3000);
                });
            });
        });
    </script>
</body>
</html>
