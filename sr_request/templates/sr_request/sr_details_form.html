<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SR Details Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .popup-message {
            position: fixed;
            top: 20px;
            right: 20px;
            background-color: #dc3545; /* Red background for error */
            color: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2>Fill Additional Details for SR Request {{ sr_request.psn }}</h2>
        <form id="sr-details-form" method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>

    <!-- Popup Message -->
    <div id="popup-message" class="popup-message"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('sr-details-form');
            const popup = document.getElementById('popup-message');

            form.addEventListener('submit', function (event) {
                event.preventDefault(); // Prevent default form submission

                const formData = new FormData(form);

                fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest',
                    },
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // Show success message
                        popup.textContent = data.message;
                        popup.style.backgroundColor = '#28a745'; // Green background for success
                        popup.style.display = 'block';

                        // Hide the popup after 3 seconds
                        setTimeout(() => {
                            popup.style.display = 'none';
                        }, 3000);
                    } else {
                        // Show error message
                        popup.textContent = data.message;
                        popup.style.backgroundColor = '#dc3545'; // Red background for error
                        popup.style.display = 'block';

                        // Hide the popup after 3 seconds
                        setTimeout(() => {
                            popup.style.display = 'none';
                        }, 3000);
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    popup.textContent = 'An error occurred. Please try again.';
                    popup.style.backgroundColor = '#dc3545'; // Red background for error
                    popup.style.display = 'block';

                    // Hide the popup after 3 seconds
                    setTimeout(() => {
                        popup.style.display = 'none';
                    }, 3000);
                });
            });
        });
    </script>
</body>
</html>
