{% extends 'base.html' %}
{% load crispy_forms_tags %}
{% if messages %}
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const successMessage = document.getElementById('successMessage');
            successMessage.style.display = 'block';
            setTimeout(() => {
                successMessage.style.display = 'none';
            }, 3000); // Hide the message after 3 seconds
        });
    </script>
{% endif %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAT LEAVE Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }
        .form-container {
            max-width: 95%;
            margin: 30px auto;
        }
        .card {
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            background: linear-gradient(to right, #007bff, #00c6ff);
            color: white;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 12px 12px 0 0;
            padding: 15px;
        }
        .form-control, .form-select {
            border-radius: 8px;
            box-shadow: none;
            transition: all 0.3s ease-in-out;
        }
        .form-control:focus, .form-select:focus {
            border-color: #007bff;
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.2);
        }
        .btn-submit {
            background: linear-gradient(to right, #28a745, #218838);
            color: white;
            font-size: 1.2rem;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            transition: all 0.3s ease-in-out;
        }
        .btn-submit:hover {
            background: linear-gradient(to right, #218838, #1e7e34);
        }
        #successMessage {
            position: fixed;
            top: 10px;
            right: 10px;
            background-color: #28a745;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            display: none;
            z-index: 1000;
        }
    </style>
</head>
<body>
    <div id="successMessage">Your form is submitted!</div>
    <div class="container form-container">
        <div class="card">
            <div class="card-header">
                SAT_LEAVE Form
            </div>
            <div class="card-body">
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="row">
                        <!-- Engineer -->
                        <div class="col-md-6 mb-3">
                            <label for="engineer">Engineer:</label>
                            <select id="engineer" name="engineer" class="form-control">
                                <option value="">Select Engineer</option>
                                <option value="arung@danlawtech.com">Arun</option>
                                <option value="eastdanlawtech.com">Arun Maity</option>
                                <option value="anilp@danlawtech.com">Anil</option>
                                <option value="dilipkumarn@danlawtech.com">Dilip</option>
                                <option value="eliyasp@danlawtech.com">Eliyas</option>
                                <option value="gayadharm@danlawtech.com">Gayadhar</option>
                                <option value="gowthamv@danlawtech.com">Gowtham</option>
                                <option value="kunal@danlawtech.com">Kunal</option>
                                <option value="narendrareddyg@danlawtech.com">Narendra</option>
                                <option value="rishwanthr@danlawtech.com">Rishwanth</option>
                                <option value="sivanambirajant@danlawtech.com">Siva</option>
                                <option value="upendram@danlawtech.com">Upendra</option>
                            </select>
                        </div>
                        <!-- Request Date -->
                        <div class="col-md-6 mb-3">
                            <label for="request_date">Request Date:</label>
                            <input type="date" id="request_date" name="request_date" class="form-control">
                        </div>
                        <!-- Category -->
                        <div class="col-md-6 mb-3">
                            <label for="category">Category:</label>
                            <select id="category" name="category" class="form-control">
                                <option value="">Select Category</option>
                                <option value="Loss of Pay">Loss of Pay</option>
                                <option value="Sick Leave">Sick Leave</option>
                                <option value="Casual Leave">Casual Leave</option>
                            </select>
                        </div>
                        <!-- Date of Leave -->
                        <div class="col-md-6 mb-3">
                            <label for="date_of_leave">Date of Leave:</label>
                            <input type="date" id="date_of_leave" name="date_of_leave" class="form-control">
                        </div>
                        <!-- Manager -->
                        <div class="col-md-6 mb-3">
                            <label for="manager">Manager:</label>
                            <select id="manager" name="manager" class="form-control">
                                <option value="">Select Manager</option>
                                <option value="rajendrans@danlawtech.com">SR</option>
                                <option value="kunal@danlawtech.com">Kunal</option>
                                <option value="narendrareddyg@danlawtech.com">Narendra Reddy</option>
                                <option value="eliyasp@danlawtech.com">Eliyas</option>
                                <option value="upendram@danlawtech.com">Eliyas</option>

                            </select>
                        </div>
                        <!-- Approved By -->
                        <div class="col-md-6 mb-3">
                            <label for="approved_by">Approved By:</label>
                            <input type="text" id="approved_by" name="approved_by" class="form-control" placeholder="Enter approver name">
                        </div>
                        <!-- Remarks -->
                        <div class="col-md-12 mb-3">
                            <label for="remarks">Remarks:</label>
                            <textarea id="remarks" name="remarks" class="form-control" rows="3" placeholder="Enter remarks"></textarea>
                        </div>
                    </div>
                    <!-- Submit Button -->
                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-submit">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
{% endblock %}
