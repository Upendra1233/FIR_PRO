{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block content %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Direct Call Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f4f6f9;
        }
        .form-container {
            max-width: 95%;
            margin: 30px auto;
        }
        .card {
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .card-header {
            background: linear-gradient(to right, #007bff, #00c6ff);
            color: white;
            text-align: center;
            font-size: 1.5rem;
            font-weight: bold;
            border-radius: 12px 12px 0 0;
            padding: 15px;
        }
        .form-control, .form-select {
            border-radius: 8px;
            box-shadow: none;
            transition: all 0.3s ease-in-out;
        }
        .form-control:focus, .form-select:focus {
            border-color: #007bff;
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.2);
        }
        .btn-submit {
            background: linear-gradient(to right, #28a745, #218838);
            color: white;
            font-size: 1.2rem;
            padding: 12px;
            width: 100%;
            border-radius: 8px;
            transition: all 0.3s ease-in-out;
        }
        .btn-submit:hover {
            background: linear-gradient(to right, #218838, #1e7e34);
        }
        .popup-message {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: #28a745;
            color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            z-index: 1000;
            display: none;
        }
    </style>
               <head>
                <!-- Include Font Awesome -->
                <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
            </head>
</head>
<body>
    <div class="container form-container">
        <div class="card">

            <div class="card-header">
               CRSC Direct call form
                <span style="float: right;">
                    <a href="{% url 'download_csv' %}" style="padding: 5px 10px; border-radius: 5px; text-decoration: none; color: #ffffff; font-size: 1.2rem;">
                        <i class="fas fa-download fa-2x"></i>
                    </a>
                </span>
            </div>

            <div class="card-body">
                <form method="post" enctype="multipart/form-data" id="managerForm">
                    {% csrf_token %}
                    <div class="row">
                        <!-- Row 1 -->
                        <div class="col-md-3 mb-3">
                            <label for="id_date_of_complaint">Date of Complaint:</label>
                            <input type="text" id="id_date_of_complaint" name="date_of_complaint" 
                                   class="form-control" value="{{ form.date_of_complaint.value|date:'Y-m-d\TH:i' }}" readonly>
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="complaint_raised_from_location">Complaint Raised Location:</label>
                            <input type="text" id="complaint_raised_from_location" name="complaint_raised_from_location" class="form-control" placeholder="Enter location">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="customer_raised_issue">Customer Voice:</label>
                            <input type="text" id="customer_raised_issue" name="customer_raised_issue" class="form-control" placeholder="Enter customer voice">
                        </div>

                        <!-- Row 2 -->
                        <div class="col-md-3 mb-3">
                            <label for="complaint_raised">Complaint Raised:</label>
                            <select id="complaint_raised" name="complaint_raised" class="form-control">
                                <option value="--">--</option>
                                <option value="Dealer">Dealer</option>
                                <option value="Customer">Customer</option>
                                <option value="AL Field">AL Field</option>
                                <option value="AL Service">AL Service</option>
                                <option value="I-Alert">I-Alert</option>
                                <option value="others">Others</option>
                            </select>
                            <input type="text" id="complaint_raised_other" name="complaint_raised_other" 
                                   class="form-control mt-2" style="display: none;" placeholder="Please specify...">
                        </div>
<!-- Complaint Raised By -->
<div class="col-md-3 mb-3">
    <label for="complaint_raised_by">Complaint Raised By:</label>
    <input type="text" id="complaint_raised_by" name="complaint_raised_by" 
           class="form-control" placeholder="Enter name" required>
</div>
                        <div class="col-md-3 mb-3">
                            <label for="contact_number">Contact Number:</label>
                            <input type="tel" id="contact_number" name="contact_number" class="form-control" placeholder="Enter contact number">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="customer_mail_id">Customer Mail ID:</label>
                            <input type="email" id="customer_mail_id" name="customer_mail_id" class="form-control" placeholder="Enter customer email">
                        </div>
                        <!-- Row 3 -->
                        <div class="col-md-3 mb-3">
                            <label for="complaint_raised_through">Complaint Raised Through:</label>
                            <select id="complaint_raised_through" name="complaint_raised_through" class="form-control">
                                <option value="--">--</option>
                                <option value="I-Alert">I-Alert</option>
                                <option value="Mail">Mail</option>
                                <option value="Telephone">Telephone</option>
                                <option value="DBM NRD">DBM NRD</option>
                                <option value="others">Others</option>
                            </select>
                            <input type="text" id="complaint_raised_through_other" name="complaint_raised_through_other" 
                                   class="form-control mt-2" style="display: none;" placeholder="Please specify...">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="complaint_received_by">Complaint Received By:</label>
                            <input type="text" id="complaint_received_by" name="complaint_received_by" class="form-control" placeholder="Enter name">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="vin">VIN:</label>
                            <input type="text" id="vin" name="vin" class="form-control" placeholder="Enter VIN">
                        </div>
                        <div class="col-md-3 mb-3">
                            {{ form.psn|as_crispy_field }}
                        </div>
                        <!-- Row 4 -->
                        <div class="col-md-3 mb-3">
                            <label for="complaint_assigned_to">Complaint Assigned To:</label>
                            <select id="complaint_assigned_to" name="complaint_assigned_to" class="form-control">
                                <option value="--">--</option>
                                <option value="Anil">Anil</option>
                                <option value="Arun Maity">Arun Maity</option>
                                <option value="Eliyas">Eliyas</option>
                                <option value="Gayadhar">Gayadhar</option>
                                <option value="Swamy">Swamy</option>
                                <option value="others">Others</option>
                            </select>
                            <input type="text" id="complaint_assigned_to_other" name="complaint_assigned_to_other" 
                                   class="form-control mt-2" style="display: none;" placeholder="Please specify...">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="submitted_to_email">Complaint Assigned Email ID:</label>
                            <input type="email" id="submitted_to_email" name="submitted_to_email" class="form-control" placeholder="Enter email">
                        </div>
                        <div class="col-md-3 mb-3">
                            <label for="engineer_contact_number">Complaint Assigned Contact Number:</label>
                            <input type="tel" id="engineer_contact_number" name="engineer_contact_number" class="form-control" placeholder="Enter engineer contact number">
                        </div>
                        <!-- Row 5 -->

                        <div class="col-md-3 mb-3">
                            <label for="upload_file">Upload File:</label>
                            <input type="file" id="upload_file" name="upload_file" class="form-control">
                        </div>
                   


                    <!-- Call Type -->
                    <div class="col-md-3 mb-3">
                        <label for="id_call_type" class="form-label">Call Type</label>
                        <select id="id_call_type" name="call_type" class="form-control">
                            <option value="--">--</option>
                            <option value="Direct Call">Direct Call</option>
                            <option value="I Alert Call">I Alert Call</option>
                     
                        </select>
                        <input type="text" id="call_type_other" name="call_type_other" 
                               class="form-control mt-2" style="display: none;" placeholder="Please specify...">
                    </div>

    <!-- Ticket No (conditionally displayed) -->
    <div class="col-md-3 mb-3" id="ticket_no_container" style="display: none;">
        <label for="id_ticket_no" class="form-label">IAlert Ticket No</label>
        <input type="text" name="ticket_no" id="id_ticket_no" class="form-control" value="{{ instance.ticket_no }}" placeholder="Enter Ticket No" {% if read_only %}readonly{% endif %}>
    </div>
</div>



                    <!-- Submit Button -->
                    <div class="text-center mt-4">
                        <button type="submit" class="btn btn-submit" onclick="this.disabled=true; this.form.submit();">Submit</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Popup Message -->
    <div id="popupMessage" class="popup-message">
        Your form is submitted!
    </div>



    <!-- JavaScript for Popup and Refresh -->
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const form = document.getElementById('managerForm');
            const popupMessage = document.getElementById('popupMessage');
            const submitButton = form.querySelector('button[type="submit"]');
    
            // Handle form submission
            form.addEventListener('submit', function (event) {
                event.preventDefault(); // Prevent default form submission
                submitButton.disabled = true; // Disable the submit button to prevent multiple clicks
    
                const formData = new FormData(form);
    
                fetch(form.action, {
                    method: 'POST',
                    body: formData,
                    headers: {
                        'X-Requested-With': 'XMLHttpRequest',
                    },
                })
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // Show the popup message
                        popupMessage.style.display = 'block';
    
                        // Hide the popup after 3 seconds and refresh the page
                        setTimeout(() => {
                            popupMessage.style.display = 'none';
                            location.reload(); // Refresh the page
                        }, 3000);
                    } else {
                        alert('There was an error: ' + (data.message || 'Please check the form.'));
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('An unexpected error occurred. Please try again.');
                })
                .finally(() => {
                    submitButton.disabled = false; // Re-enable the submit button in case of an error
                });
            });
    
            // Handle "Others" dropdown behavior
            const fieldsWithOthers = [
                { dropdown: 'complaint_raised', otherInput: 'complaint_raised_other' },
                { dropdown: 'complaint_raised_through', otherInput: 'complaint_raised_through_other' },
                { dropdown: 'complaint_assigned_to', otherInput: 'complaint_assigned_to_other' },
                { dropdown: 'call_type', otherInput: 'call_type_other' },
            ];
    
            fieldsWithOthers.forEach(field => {
                const dropdown = document.getElementById(field.dropdown);
                const otherInput = document.getElementById(field.otherInput);
    
                dropdown.addEventListener('change', function () {
                    if (dropdown.value === 'others') {
                        otherInput.style.display = 'block';    
                        otherInput.required = true;
                    } else {
                        otherInput.style.display = 'none';
                        otherInput.required = false;
                        otherInput.value = ''; // Clear the value when not needed
                    }
                });
            });
    
            // Validation for VIN and Contact Numbers
            const vinField = document.getElementById('vin');
            const contactFields = [
                document.getElementById('contact_number'),
                document.getElementById('engineer_contact_number'),
                document.getElementById('additional_contact_number'), // Added new contact field
            ];
    
            vinField.addEventListener('input', function () {
                this.value = this.value.toUpperCase().replace(/[^A-HJ-NPR-Z0-9]/g, '').slice(0, 17);
            });
    
            contactFields.forEach(field => {
                field.addEventListener('input', function () {
                    this.value = this.value.replace(/[^0-9]/g, '').slice(0, 10);
                });
            });

            // Automatically convert input to uppercase for Complaint Raised By
            const complaintRaisedBy = document.getElementById('complaint_raised_by');
            complaintRaisedBy.addEventListener('input', function () {
                this.value = this.value.toUpperCase();
            });
        });
    </script>
    <script>
    document.addEventListener('DOMContentLoaded', function () {
        const dateOfComplaintField = document.getElementById('id_date_of_complaint');
        if (!dateOfComplaintField.value) {
            const now = new Date();

            // Convert to IST (UTC+5:30)
            const istOffset = 5.5 * 60 * 60 * 1000; // 5 hours 30 minutes in milliseconds
            const istTime = new Date(now.getTime() + istOffset);

            // Format as 'YYYY-MM-DDTHH:mm'
            const year = istTime.getFullYear();
            const month = String(istTime.getMonth() + 1).padStart(2, '0');
            const day = String(istTime.getDate()).padStart(2, '0');
            const hours = String(istTime.getHours()).padStart(2, '0');
            const minutes = String(istTime.getMinutes()).padStart(2, '0');
            const formattedDate = `${year}-${month}-${day}T${hours}:${minutes}`;

            dateOfComplaintField.value = formattedDate;
        }
    });
</script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const dateOfComplaintField = document.getElementById('id_date_of_complaint');

        function updateDateOfComplaint() {
            const now = new Date();

            // Convert to IST (UTC+5:30) only if the time is in UTC
            const istTime = new Date(now.getTime() + (now.getTimezoneOffset() * 60 * 1000) + (5.5 * 60 * 60 * 1000));

            // Format as 'YYYY-MM-DDTHH:mm'
            const year = istTime.getFullYear();
            const month = String(istTime.getMonth() + 1).padStart(2, '0');
            const day = String(istTime.getDate()).padStart(2, '0');
            const hours = String(istTime.getHours()).padStart(2, '0');
            const minutes = String(istTime.getMinutes()).padStart(2, '0');
            const formattedDate = `${year}-${month}-${day}T${hours}:${minutes}`;

            dateOfComplaintField.value = formattedDate;
        }

        // Update the field immediately on page load
        updateDateOfComplaint();

        // Update the field every minute
        setInterval(updateDateOfComplaint, 60000); // 60000ms = 1 minute
    });
</script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const callTypeField = document.getElementById('id_call_type');
        const ticketNoContainer = document.getElementById('ticket_no_container');
        const ticketNoField = document.getElementById('id_ticket_no');

        // Function to toggle the Ticket No field
        function toggleTicketNoField() {
            if (callTypeField.value === 'I Alert Call') {
                ticketNoContainer.style.display = 'block';
                ticketNoField.required = true; // Make Ticket No required
            } else {
                ticketNoContainer.style.display = 'none';
                ticketNoField.required = false; // Remove required attribute
                ticketNoField.value = ''; // Clear the value
            }
        }

        // Add event listener to Call Type field
        callTypeField.addEventListener('change', toggleTicketNoField);

        // Initialize the visibility of the Ticket No field on page load
        toggleTicketNoField();
    });
</script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const callTypeField = document.getElementById('id_call_type');
        const ticketNoContainer = document.getElementById('ticket_no_container');
        const ticketNoField = document.getElementById('id_ticket_no');

        // Function to toggle the Ticket No field
        function toggleTicketNoField() {
            if (callTypeField.value === 'I Alert Call') {
                ticketNoContainer.style.display = 'block';
                ticketNoField.required = true; // Make Ticket No required
            } else {
                ticketNoContainer.style.display = 'none';
                ticketNoField.required = false; // Remove required attribute
                ticketNoField.value = ''; // Clear the value
            }
        }

        // Add event listener to Call Type field
        callTypeField.addEventListener('change', toggleTicketNoField);

        // Initialize the visibility of the Ticket No field on page load
        toggleTicketNoField();

        // Enforce 5-digit limit for Ticket No
        ticketNoField.addEventListener('input', function () {
            this.value = this.value.replace(/[^0-9]/g, ''); // Allow only digits
            if (this.value.length > 5) {
                this.value = this.value.slice(0, 5); // Limit to 5 digits
            }
        });
    });
</script>
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const fieldsWithOthers = [
            { dropdown: 'complaint_raised', otherInput: 'complaint_raised_other' },
            { dropdown: 'complaint_raised_through', otherInput: 'complaint_raised_through_other' },
            { dropdown: 'complaint_assigned_to', otherInput: 'complaint_assigned_to_other' },
            { dropdown: 'call_type', otherInput: 'call_type_other' },
        ];

        fieldsWithOthers.forEach(field => {
            const dropdown = document.getElementById(field.dropdown);
            const otherInput = document.getElementById(field.otherInput);

            // Function to toggle the "Others" input field
            function toggleOtherInput() {
                if (dropdown.value === 'others') {
                    otherInput.style.display = 'block'; // Show the input field
                    otherInput.required = true; // Make it required
                    otherInput.removeAttribute('disabled'); // Ensure it's editable
                } else {
                    otherInput.style.display = 'none'; // Hide the input field
                    otherInput.required = false; // Remove the required attribute
                    otherInput.value = ''; // Clear the value
                    otherInput.setAttribute('disabled', 'true'); // Disable the field
                }
            }

            // Add event listener to the dropdown
            dropdown.addEventListener('change', toggleOtherInput);

            // Initialize the visibility of the "Others" input field on page load
            toggleOtherInput();
        });
    });
</script>
</body>
</html>
{% endblock %}
