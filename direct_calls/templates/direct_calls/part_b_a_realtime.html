    <script>
        let lastRecordId = null; // To track the last record ID
        let currentPage = 1; // Track the current page
        let assignedToChart, callStatusChart, callStatusPieChart;
        let selectedFieldsForTable = []; // Track selected fields for table display

        $(document).ready(function () {
            // Trigger filtering when VIN input changes
            $('#vin').on('input', function () {
                const vinValue = $(this).val();
                if (vinValue.length >= 5) {
                    fetchFilteredRecords(); // Fetch records if VIN has at least 5 characters
                }
            });
            $('#ticket_no').on('input', function () {
                const ticketNoValue = $(this).val();
                if (ticketNoValue.length >= 3) {
                    fetchFilteredRecords(); // Fetch records if Ticket No has at least 5 characters
                }
            });
                        // Trigger filtering when Unique ID input changes
            $('#unique_id').on('input', function () {
                const uniqueIdValue = $(this).val();
                if (uniqueIdValue.length >= 5) {
                    fetchFilteredRecords(); // Fetch records if Unique ID has at least 5 characters
                }
            });

            // Fetch records when other filters change
            $('#from_date, #to_date, #call_status, #assigned_to, #call_type, #part_b_status, #activity_status_ba, #d2_exp_start, #d2_exp_end, #d3_exp_start, #d3_exp_end, #date_of_closure_from, #date_of_closure_to').on('change', function () {
    fetchFilteredRecords();
});
            fetchFilteredRecords();
            setInterval(checkForNewRecords, 5000);

            $('#downloadData').on('click', function (e) {
                e.preventDefault(); // Prevent the default link behavior
                window.location.href = "{% url 'download_csv' %}"; // Trigger the download
            });
        });
        function fetchFilteredRecords() {
            // reset to first page whenever user changes filters
            currentPage = 1;

            const fromDate = $('#from_date').val();
            const toDate = $('#to_date').val();

            // Use selected call statuses from UI; when "All" or none selected, don't send filter
            const callStatusSelected = $('#call_status').val() || [];
            const callStatusParam = (callStatusSelected.length === 0 || callStatusSelected.includes('All')) ? null : callStatusSelected;

            const assignedTo = $('#assigned_to').val();
            const callType = $('#call_type').val();
            const partBStatus = $('#part_b_status').val() || 'All';
            const activityStatusBA = $('#activity_status_ba').val() || 'All';
            const vin = $('#vin').val();
            const ticketNo = $('#ticket_no').val();
            const uniqueId = $('#unique_id').val();
            const d2ExpStart = $('#d2_exp_start').val();
            const d2ExpEnd = $('#d2_exp_end').val();
            const d3ExpStart = $('#d3_exp_start').val();
            const d3ExpEnd = $('#d3_exp_end').val();
            const params = {
                from_date: fromDate,
                to_date: toDate,
                assigned_to: assignedTo,
                call_type: callType,
                part_b_status: partBStatus,
                activity_status_ba: activityStatusBA,
                vin: vin,
                ticket_no: ticketNo,
                unique_id: uniqueId,
                d2_exp_start: d2ExpStart,
                d2_exp_end: d2ExpEnd,
                d3_exp_start: d3ExpStart,
                d3_exp_end: d3ExpEnd,
                date_of_closure_from: $('#date_of_closure_from').val(),
                date_of_closure_to: $('#date_of_closure_to').val(),
                page: currentPage
            };
 
             if (callStatusParam) {
                 params.call_status = callStatusParam;
             }
            console.debug('fetchFilteredRecords params:', params);
 
    $.ajax({
         url: "{% url 'fetch_records_with_fields' %}",
         method: "GET",
         traditional: true,
         data: params,
         success: function (response) {
            console.debug('fetch response (full):', response);
            // debug: inspect raw number of rows returned by server before client-side part_b filtering
            console.debug('server returned rows:', Array.isArray(response.data) ? response.data.length : 0, 'first 3 rows:', response.data ? response.data.slice(0,3) : []);
 
            if (!response || (Array.isArray(response) && response.length === 0)) {
                showPopupNotification('No data returned from server.');
                $('#realTimeTableBody').empty();
                return;
            }
 
            if (!response.data) {
                const fallback = response.records || response.results || response.items || [];
                updateTable(fallback);
                if (response.call_counts) updateCallCounts(response.call_counts);
                if (response.charts) updateCharts(response.charts);
                $('#prevPage').prop('disabled', true);
                $('#nextPage').prop('disabled', true);
                $('#pageInfo').text('Page 1 of 1');
                return;
            }
            response.data.forEach(rec => {
                rec.part_b_status = (rec.final_status === 'Closed') ? 'Closed' : 'Pending';
            });
            const selectedPartB = $('#part_b_status').val() || 'All';
            const selectedActivityBA = ($('#activity_status_ba').val() || 'All').toString();

            // start with server data
            let displayData = response.data;

            // apply Part-B(A) client-side filter if needed
            if (selectedPartB !== 'All') {
                displayData = displayData.filter(r => (r.part_b_status || (r.final_status === 'Closed' ? 'Closed' : 'Pending')) === selectedPartB);
            }

            // apply Activity Status B(A) client-side filter as fallback
            if (selectedActivityBA !== 'All') {
                displayData = displayData.filter(r => {
                    // try a few possible field names returned by server
                    const val = (r.activity_status_ba || r.activity_status || r.activity_status_b || r.activity || '').toString();
                    return val.toLowerCase() === selectedActivityBA.toLowerCase();
                });
            }
             updateTable(displayData);
             updateTableHeaders();
            
            $('#prevPage').prop('disabled', !response.has_previous);
            $('#nextPage').prop('disabled', !response.has_next);
            $('#pageInfo').text(`Page ${response.current_page} of ${response.total_pages}`);
            
            if (response.call_counts) updateCallCounts(response.call_counts);
            if (response.charts) updateCharts(response.charts);
            
            if (!response.data || response.data.length === 0) {
                showPopupNotification('No records match the applied filters.');
            }
        },
        error: function (error) {
            console.error("Error fetching records:", error);
            showPopupNotification('Error fetching records — check console/Network tab.');
        }
    });
}
        function updateCharts(chartData) {
    // Assigned To Chart
    const callStatusPieLabels = chartData.call_status_pie.map(item => item.call_status || "Unknown");
    const callStatusPieCounts = chartData.call_status_pie.map(item => item.count);

    if (callStatusPieChart) {
        callStatusPieChart.destroy();
    }
    const callStatusPieCtx = document.getElementById('callStatusPieChart').getContext('2d');
    callStatusPieChart = new Chart(callStatusPieCtx, {
        type: 'pie',
        data: {
            labels: callStatusPieLabels,
            datasets: [{
                data: callStatusPieCounts,
                backgroundColor: callStatusPieLabels.map(label => {
                    if (label === "Resolved") return "Green";
                    if (label === "Closed") return "Orange";
                    if (label === "Pending") return "Red";
                    if (label === "FIR-Resolved") return "Blue";
                    if (label === "FIR-For Approval") return "Yellow";
                    if (label === "Reject") return "Black";
                    if (label === "Cancelled") return "Gray";
                    if (label === "D1 Done") return "Pink";
                    if (label === "D2 Done") return "Silver";
                    if (label === "FIR-Repair") return "Teal";
                    if (label === "FIR-Replace_Repair") return "Brown";
                    if (label === "FIR-Replace") return "SkyBlue";

                    return `hsl(${Math.floor(Math.random() * 360)}, 70%, 70%)`;
                }),
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'bottom',
                },
                datalabels: {
                    color: '#fff',
                    font: {
                        size: 14,
                    },
                    formatter: (value, context) => {
                        const label = context.chart.data.labels[context.dataIndex];
                        return `${value}`;
                    },
                },
            },
        },
        plugins: [ChartDataLabels],
    });
    const assignedToLabels = chartData.assigned_to.map(item => item.call_status || "Unassigned");
    const assignedToCounts = chartData.assigned_to.map(item => item.count);

    if (assignedToChart) {
        assignedToChart.destroy();
    }
    const assignedToCtx = document.getElementById('assignedToChart').getContext('2d');
    assignedToChart = new Chart(assignedToCtx, {
        type: 'pie',
        data: {
            labels: assignedToLabels,
            datasets: [{
                data: assignedToCounts,
                backgroundColor: assignedToLabels.map(label => {
                    if (label === "Resolved") return "Green";
                    if (label === "Closed") return "Orange";
                    if (label === "Pending") return "Red";
                    if (label === "FIR-Resolved") return "Blue";
                    if (label === "FIR-For Approval") return "Yellow";
                    if (label === "Reject") return "Black";
                    if (label === "Cancelled") return "Gray";
                    if (label === "D1 Done") return "Pink";
                    if (label === "D2 Done") return "Silver";
                    if (label === "FIR-Repair") return "Teal";
                    if (label === "FIR-Replace_Repair") return "Brown";
                    if (label === "FIR-Replace") return "SkyBlue";
                    return `hsl(${Math.floor(Math.random() * 360)}, 70%, 70%)`;
                }),
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: 'bottom',
                },
                datalabels: {
                    color: '#fff',
                    font: {
                        size: 14,
                    },
                    formatter: (value, context) => {
                        const label = context.chart.data.labels[context.dataIndex];
                        return `${value}`;
                    },
                },
            },
        },
        plugins: [ChartDataLabels],
    });
    // Call Status Chart
    const callStatusLabels = chartData.call_status.map(item => item.call_status || "Unknown");
    const callStatusCounts = chartData.call_status.map(item => item.count);
    if (callStatusChart) {
        callStatusChart.destroy();

        // Function to convert UTC date to IST
        function convertToIST(utcDate) {
            if (!utcDate) return '';
            // Ensure the date string is in ISO format and ends with 'Z' (UTC)
            let dateObj;
            if (typeof utcDate === 'string' && utcDate.length === 19 && utcDate.indexOf('T') === -1) {
                // Convert "YYYY-MM-DD HH:MM:SS" to "YYYY-MM-DDTHH:MM:SSZ"
                dateObj = new Date(utcDate.replace(' ', 'T') + 'Z');
            } else {
                dateObj = new Date(utcDate);
            }
            if (isNaN(dateObj)) return utcDate; // fallback if invalid
            const istOffset = 5.5 * 60 * 60 * 1000;
            const istDate = new Date(dateObj.getTime() + istOffset);
            return istDate.toISOString().slice(0, 19).replace('T', ' ');
        }

        // Function to calculate TAT in HH:MM:SS format
        function calculateTAT(dateOfComplaint, dateOfClosure) {
            if (!dateOfComplaint || !dateOfClosure) return '--';

            const complaintDate = new Date(dateOfComplaint);
            const closureDate = new Date(dateOfClosure);

            const diffInMs = closureDate - complaintDate; // Difference in milliseconds
            if (diffInMs < 0) return '--'; // Invalid case

            const hours = Math.floor(diffInMs / (1000 * 60 * 60));
            const minutes = Math.floor((diffInMs % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diffInMs % (1000 * 60)) / 1000);

            return `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }

        // Function to download data as a CSV file
        function downloadCSV(data, fields) {
            // List of date fields to convert
            const dateFields = [
                'date_of_complaint', 'date_of_closure', 'activation_start_date', 'activation_end_date',
                'vehicle_sale_date', 'first_communication_in_darby', 'last_communication_in_darby',
                'D1_closure_date', 'D2_closure_date'
            ];

            // Helper to convert UTC to IST
            function convertToIST(utcDate) {
                if (!utcDate) return '';
                // Ensure the date string is in ISO format and ends with 'Z' (UTC)
                let dateObj;
                if (typeof utcDate === 'string' && utcDate.length === 19 && utcDate.indexOf('T') === -1) {
                    // Convert "YYYY-MM-DD HH:MM:SS" to "YYYY-MM-DDTHH:MM:SSZ"
                    dateObj = new Date(utcDate.replace(' ', 'T') + 'Z');
                } else {
                    dateObj = new Date(utcDate);
                }
                if (isNaN(dateObj)) return utcDate; // fallback if invalid
                const istOffset = 5.5 * 60 * 60 * 1000;
                const istDate = new Date(dateObj.getTime() + istOffset);
                return istDate.toISOString().slice(0, 19).replace('T', ' ');
            }
            const csvRows = [];
            const headers = fields.map(field => field.replace(/_/g, ' '));
            csvRows.push(headers.join(','));
            data.forEach(record => {
                const row = fields.map(field => {
                    let value = record[field] || '';
                    if (dateFields.includes(field) && value) {
                        value = convertToIST(value);
                    }
                    return `"${value}"`;
                });
                csvRows.push(row.join(','));
            });
            const csvContent = csvRows.join('\n');
            const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
            const url = URL.createObjectURL(blob);
            const now = new Date();
            const istOffset = 0;
            const istDate = new Date(now.getTime());
            const year = istDate.getFullYear();
            const month = String(istDate.getMonth() + 1).padStart(2, '0');
            const day = String(istDate.getDate()).padStart(2, '0');
            const hours = String(istDate.getHours()).padStart(2, '0');
            const minutes = String(istDate.getMinutes()).padStart(2, '0');
            const seconds = String(istDate.getSeconds()).padStart(2, '0');
            const timestamp = `${year}${month}${day}_${hours}${minutes}${seconds}`;
            const fileName = `CRSC_Calls_${timestamp}.csv`;
            const link = document.createElement('a');
            link.setAttribute('href', url);
            link.setAttribute('download', fileName);
            link.style.display = 'none';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }
    });
</script>

<script>

    // "Select All" functionality

    // "Clear Selection" button (if you have it)
    $(document).on('click', '#clearSelectionButton', function(e) {

        $('.field-checkbox').prop('checked', false).trigger('change');
        $('#select_all_fields').prop('checked', false);
    });
});
