<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>{% block title %}FIR_PRO{% endblock %}</title>
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
  <div class="container-fluid">
    <a class="navbar-brand" href="/">FIR_PRO</a>

    <div class="d-flex align-items-center">
      {% if user.is_authenticated %}
        <span class="text-light me-3">Hello, {{ user.get_full_name|default:user.username }}</span>
        <a href="{% url 'site_logout' %}" class="btn btn-outline-light btn-sm me-2">Logout</a>
      {% else %}
        <a href="{% url 'site_login' %}" class="btn btn-outline-light btn-sm me-2">Login</a>
      {% endif %}
    </div>
  </div>
</nav>

<div class="container-fluid mt-3">
  {% block content %}{% endblock %}
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
