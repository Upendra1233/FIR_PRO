<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Billing Data Entry Form</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .form-container {
            background-color: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .form-header {
            background-color: #007bff;
            color: white;
            padding: 10px;
            border-radius: 10px 10px 0 0;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            position: relative;
        }
        .form-footer {
            text-align: center;
            margin-top: 20px;
        }
        .form-footer button {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
        }
        .form-footer button:hover {
            background-color: #218838;
        }
        .form-control {
            border-radius: 5px;
        }
        #success-popup {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #28a745;
            color: #fff;
            padding: 10px 20px;
            border-radius: 6px;
            font-size: 16px;
            z-index: 9999;
            box-shadow: 0 2px 8px rgba(40,167,69,0.15);
            animation: fadeInOut 2.5s forwards;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(-10px);}
            10% { opacity: 1; transform: translateY(0);}
            90% { opacity: 1; }
            100% { opacity: 0; transform: translateY(-10px);}
        }
    </style>
    <script>
        function calculateInvoiceValueWithoutGST() {
            const gstValueInput = document.getElementById('total_invoice_value_with_gst');
            const withoutGSTInput = document.getElementById('invoice_value_without_gst');
            const gstValue = parseFloat(gstValueInput.value);

            if (!isNaN(gstValue)) {
                const invoiceWithoutGST = (gstValue / 1.18).toFixed(2);
                withoutGSTInput.value = invoiceWithoutGST;


            } else {
                withoutGSTInput.value = '';
            }
        }

        function calculateGap() {
            const gstValue = parseFloat(document.getElementById('total_invoice_value_with_gst').value) || 0;
            const creditedAmount = parseFloat(document.getElementById('credited_amount').value) || 0;
            const tdsAmount = parseFloat(document.getElementById('tds_amount').value) || 0;
            const gapInput = document.getElementById('gap');

            const gap = gstValue - creditedAmount - tdsAmount;
            gapInput.value = gap.toFixed(2); // Calculate and set the GAP value

            // Update payment status based on the new GAP value
            updatePaymentStatus();
        }

        function updatePaymentStatus() {
            const gap = parseFloat(document.getElementById('gap').value) || 0;
            const creditedAmount = parseFloat(document.getElementById('credited_amount').value) || 0;
            const paymentStatus = document.getElementById('payment_status');

            // Check the condition
            if (gap === 0 && creditedAmount > 0) {
                paymentStatus.value = 'Received'; // Automatically set to Received
            } else {
                paymentStatus.value = 'Pending'; // Automatically set to Pending
            }
        }

        function calculateTheoreticalPaymentDueDate() {
            const invoiceDateInput = document.getElementById('invoice_date');
            const locationInput = document.getElementById('location');
            const itemSubCategoryInput = document.getElementById('item_sub_category');
            const dueDateInput = document.getElementById('theoretical_payment_due_date');

            const invoiceDateValue = invoiceDateInput.value;
            const locationValue = locationInput.value;
            const itemSubCategory = itemSubCategoryInput.value;

            if (invoiceDateValue && locationValue && itemSubCategory) {
                const invoiceDate = new Date(invoiceDateValue);
                let daysToAdd = 0;

                if (locationValue === 'ALCOB' && itemSubCategory === 'Hardware') {
                    daysToAdd = 18;
                } else if (itemSubCategory === 'Software') {
                    daysToAdd = 17;
                } else if (itemSubCategory === 'SIM') {
                    daysToAdd = 32;
                } else if (itemSubCategory === 'NRE') {
                    daysToAdd = 17;
                } else if (['Chennai', 'Ennore', 'Hosur', 'Hosur 1', 'Hosur 2', 'VVC'].includes(locationValue) && itemSubCategory === 'Hardware') {
                    daysToAdd = 52;
                } else if (['Pant Nagar', 'Alwar'].includes(locationValue) && itemSubCategory === 'Hardware') {
                    daysToAdd = 55;
                } else {
                    daysToAdd = 0;
                }

                invoiceDate.setDate(invoiceDate.getDate() + daysToAdd);

                const year = invoiceDate.getFullYear();
                const month = String(invoiceDate.getMonth() + 1).padStart(2, '0');
                const day = String(invoiceDate.getDate()).padStart(2, '0');
                dueDateInput.value = `${year}-${month}-${day}`;
            } else {
                dueDateInput.value = '';
            }
        }

        function calculateDueDate() {
            const customerNameInput = document.getElementById('customer_name');
            const itemSubCategoryInput = document.getElementById('item_sub_category');
            const grnDateInput = document.getElementById('actual_grn_delivery_date');
            const theoreticalDueDateInput = document.getElementById('theoretical_payment_due_date');
            const dueDateInput = document.getElementById('due_date');

            const customerName = customerNameInput.value;
            const itemSubCategory = itemSubCategoryInput.value;
            const grnDateValue = grnDateInput.value;

            if (grnDateValue) {
                const grnDate = new Date(grnDateValue);
                let daysToAdd = 0;

                // Logic for calculating Due Date
                if (customerName === 'Ashok Leyland Limited' && itemSubCategory === 'Hardware') {
                    daysToAdd = 45;
                } else if (customerName === 'Switch' && itemSubCategory === 'Hardware') {
                    daysToAdd = 45;
                } else if (customerName === 'Ashok Leyland Limited' && itemSubCategory === 'Software') {
                    daysToAdd = 15;
                } else if (customerName === 'Royal Enfield' && itemSubCategory === 'Hardware') {
                    daysToAdd = 45;
                } else if (customerName === 'Ashok Leyland Limited' && itemSubCategory === 'SIM') {
                    daysToAdd = 15;
                } else if (customerName === 'Ashok Leyland Limited' && itemSubCategory === 'NRE') {
                    daysToAdd = 30;
                } else {
                    // Default to Theoretical Payment Due Date
                    dueDateInput.value = theoreticalDueDateInput.value;
                    return;
                }

                // Calculate the Due Date
                grnDate.setDate(grnDate.getDate() + daysToAdd);

                // Format the date as YYYY-MM-DD
                const year = grnDate.getFullYear();
                const month = String(grnDate.getMonth() + 1).padStart(2, '0');
                const day = String(grnDate.getDate()).padStart(2, '0');
                dueDateInput.value = `${year}-${month}-${day}`;
            } else {
                dueDateInput.value = ''; // Clear the field if GRN Date is invalid
            }

    }
    </script>
</head>
<body>

{% if billing_data.location and billing_data.location not in "Pant Nagar,Alwar,ALCOB,Chennai,Ennore,Hosur,Hosur 1,Hosur 2,Hosur SPD,VVC,Bangalore,Others" %}

<!-- Add this script before </body> -->
<script>
document.addEventListener('DOMContentLoaded', function () {
    const form = document.querySelector('form');

    const customerSelect = document.getElementById('customer_name');
    const customerOtherInput = document.getElementById('customer_name_other');

    const partNoSelect = document.getElementById('part_no');
    const partNoOtherInput = document.getElementById('part_no_other');

    const locationSelect = document.getElementById('location');
    const locationOtherInput = document.getElementById('location_other');

    const productSelect = document.getElementById('product');
    const productOtherInput = document.getElementById('product_other');

    const categorySelect = document.getElementById('category');
    const categoryOtherInput = document.getElementById('category_other');

    const partSubCategorySelect = document.getElementById('part_sub_category');
    const partSubCategoryOtherInput = document.getElementById('part_sub_category_other');
    // --- Show/Hide "Others" fields based on selection ---
    function toggleOtherField(selectEl, otherInput) {
        if (selectEl.value.toLowerCase() === 'others') {
            otherInput.style.display = 'block';
            otherInput.required = true;
        } else {
            otherInput.style.display = 'none';
            otherInput.required = false;
        }
    }

    // Initial toggle on page load
    toggleOtherField(customerSelect, customerOtherInput);
    toggleOtherField(locationSelect, locationOtherInput);
    toggleOtherField(partNoSelect, partNoOtherInput);
    toggleOtherField(productSelect, productOtherInput);
    toggleOtherField(categorySelect, categoryOtherInput);
    toggleOtherField(partSubCategorySelect, partSubCategoryOtherInput);
    // On change
    customerSelect.addEventListener('change', () => toggleOtherField(customerSelect, customerOtherInput));
    locationSelect.addEventListener('change', () => toggleOtherField(locationSelect, locationOtherInput));
    partNoSelect.addEventListener('change', () => toggleOtherField(partNoSelect, partNoOtherInput));
    productSelect.addEventListener('change', () => toggleOtherField(productSelect, productOtherInput));
    categorySelect.addEventListener('change', () => toggleOtherField(categorySelect, categoryOtherInput));
    partSubCategorySelect.addEventListener('change', () => toggleOtherField(partSubCategorySelect, partSubCategoryOtherInput));

    // --- Form Submission Logic ---
    form.addEventListener('submit', function (e) {
        const invoiceNo = document.querySelector('input[name="invoice_no"]').value.trim();

        if (!invoiceNo) {
            e.preventDefault();
            const modal = new bootstrap.Modal(document.getElementById('invoiceNoModal'));
            modal.show();
            return;
        }

        // If "Others" selected, copy value to the select element
        if (customerSelect.value.toLowerCase() === 'others') {
            if (customerOtherInput.value.trim()) {
                customerSelect.innerHTML += `<option value="${customerOtherInput.value.trim()}" selected>${customerOtherInput.value.trim()}</option>`;
                customerSelect.value = customerOtherInput.value.trim();
            }
        }

        if (locationSelect.value.toLowerCase() === 'others') {
            if (locationOtherInput.value.trim()) {
                locationSelect.innerHTML += `<option value="${locationOtherInput.value.trim()}" selected>${locationOtherInput.value.trim()}</option>`;
                locationSelect.value = locationOtherInput.value.trim();
            }
        }
        if (partNoSelect.value.toLowerCase() === 'others') {
            if (partNoOtherInput.value.trim()) {
                partNoSelect.innerHTML += `<option value="${partNoOtherInput.value.trim()}" selected>${partNoOtherInput.value.trim()}</option>`;
                partNoSelect.value = partNoOtherInput.value.trim();
            }
        }
        if (productSelect.value.toLowerCase() === 'others') {
            if (productOtherInput.value.trim()) {
                productSelect.innerHTML += `<option value="${productOtherInput.value.trim()}" selected>${productOtherInput.value.trim()}</option>`;
                productSelect.value = productOtherInput.value.trim();
            }
        }
        if (categorySelect.value.toLowerCase() === 'others') {
            if (categoryOtherInput.value.trim()) {
                categorySelect.innerHTML += `<option value="${categoryOtherInput.value.trim()}" selected>${categoryOtherInput.value.trim()}</option>`;
                categorySelect.value = categoryOtherInput.value.trim();
            }
        }   
        if (partSubCategorySelect.value.toLowerCase() === 'others') {
            if (partSubCategoryOtherInput.value.trim()) {
                partSubCategorySelect.innerHTML += `<option value="${partSubCategoryOtherInput.value.trim()}" selected>${partSubCategoryOtherInput.value.trim()}</option>`;
                partSubCategorySelect.value = partSubCategoryOtherInput.value.trim();
            }
        }
    });
});
</script>

</body>
